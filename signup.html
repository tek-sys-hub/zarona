<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Zarona Unisex</title>
  <meta name="description" content="Join Zarona Unisex to unlock exclusive member drops, early access to new collections, and faster checkout.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Left Side Brand Panel (PC) -->
      <aside class="auth-side-panel">
        <div class="auth-side-content">
          <div>
            <h1 class="auth-brand-title">Zarona</h1>
            <div class="auth-brand-sub">Unisex</div>
          </div>
          
          <h2 class="auth-side-slogan">Style Without Limits</h2>
          <div class="auth-side-bar"></div>
        </div>
      </aside>

      <!-- Right Side Form Panel -->
      <section class="auth-form-panel">
        <!-- Close / Return Home Button -->
        <a href="/index.html" class="auth-close-link" aria-label="Return to homepage">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </a>

        <!-- Mobile Header Banner -->
        <div class="auth-mobile-banner">
          <img src="/assets/images/auth_mobile_banner.jpg" alt="Zarona Unisex">
          <div class="auth-mobile-banner-overlay">
            <span class="auth-brand-title" style="font-size: 1.4rem;">Zarona</span>
            <span class="auth-brand-sub" style="font-size: 0.55rem;">Unisex</span>
          </div>
        </div>

        <div class="auth-heading-wrap">
          <h2 class="auth-title">Create Account</h2>
          <p class="auth-subtitle">Join Zarona Unisex today</p>
        </div>

        <form class="auth-form" id="signup-form" onsubmit="event.preventDefault(); alert('Account created successfully! Welcome to Zarona Unisex.'); window.location.href='/login.html';">
          <!-- Full Name Input -->
          <div class="auth-input-group">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" class="auth-input" placeholder="Full Name" required autocomplete="name">
          </div>

          <!-- Email Address Input -->
          <div class="auth-input-group">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" class="auth-input" placeholder="Email Address" required autocomplete="email">
          </div>

          <!-- Password Input -->
          <div class="auth-input-group">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="signup-password" class="auth-input" placeholder="Password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" id="toggle-signup-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Confirm Password Input -->
          <div class="auth-input-group">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="signup-confirm-password" class="auth-input" placeholder="Confirm Password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" id="toggle-confirm-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Terms Checkbox -->
          <div class="auth-helper-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" required style="accent-color: #121212;">
              <span style="font-size: 0.8rem; line-height: 1.3;">I agree to the <strong>Terms & Conditions</strong> and <strong>Privacy Policy</strong></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-submit-btn">Sign Up</button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Social Buttons -->
        <div class="social-auth-grid">
          <button type="button" class="social-auth-btn" onclick="alert('Google authentication connected.');">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.97 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            Google
          </button>

          <button type="button" class="social-auth-btn" onclick="alert('Apple authentication connected.');">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.67-.82 1.12-1.95.99-3.09-1 .04-2.15.65-2.82 1.45-.59.69-1.11 1.82-.97 2.93 1.11.08 2.19-.57 2.8-1.29z"/>
            </svg>
            Apple
          </button>
        </div>

        <!-- Switch link to Login -->
        <p class="auth-switch-text">
          Already have an account?
          <a href="/login.html" class="auth-switch-link">Login</a>
        </p>
      </section>
    </div>
  </main>

  <script>
    // Password visibility toggles
    const setupToggle = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (btn && input) {
        btn.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          btn.style.color = isPassword ? '#121212' : '#8F887F';
        });
      }
    };

    setupToggle('toggle-signup-password', 'signup-password');
    setupToggle('toggle-confirm-password', 'signup-confirm-password');
  </script>
</body>
</html>
