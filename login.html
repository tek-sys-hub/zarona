<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Zarona Unisex</title>
  <meta name="description" content="Login to your Zarona Unisex account to view orders, track shipments, and access private drops.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-fullscreen-page">

  <!-- Top Bar -->
  <header class="auth-top-bar">
    <a href="/index.html" class="auth-top-logo" aria-label="Zarona Unisex Homepage">
      <img src="/assets/images/logo_white.png" alt="Zarona Unisex">
    </a>

    <a href="/index.html" class="auth-back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>
  </header>

  <!-- Center Card -->
  <main class="auth-center-wrap">
    <div class="auth-glass-card">
      <span class="auth-card-eyebrow">WELCOME BACK</span>
      <h1 class="auth-card-title">Login to Your Account</h1>
      <p class="auth-card-subtitle">Continue your journey with Zarona.</p>

      <div id="login-error-msg" style="display: none; background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #fca5a5; font-size: 0.85rem; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; text-align: center; line-height: 1.4;"></div>

      <form class="auth-glass-form" id="login-form">
        <!-- Email or Username -->
        <div class="auth-glass-input-group">
          <svg class="auth-glass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <input type="email" id="login-email" class="auth-glass-input" placeholder="Email Address" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="auth-glass-input-group">
          <svg class="auth-glass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="login-password" class="auth-glass-input" placeholder="Password" required autocomplete="current-password">
          <button type="button" class="auth-glass-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <!-- Remember me & Forgot Password -->
        <div class="auth-glass-helper-row">
          <label class="auth-glass-checkbox">
            <input type="checkbox" style="accent-color: #EDE8DE;">
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-glass-forgot" onclick="return false;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-glass-cta-btn" id="login-submit-btn">
          <span>Login</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-glass-divider">
        <span>or</span>
      </div>

      <!-- Social Buttons -->
      <button type="button" class="auth-glass-social-btn" onclick="console.log('Social auth');">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.97 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button type="button" class="auth-glass-social-btn" onclick="console.log('Apple auth');">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.67-.82 1.12-1.95.99-3.09-1 .04-2.15.65-2.82 1.45-.59.69-1.11 1.82-.97 2.93 1.11.08 2.19-.57 2.8-1.29z"/>
        </svg>
        <span>Continue with Apple</span>
      </button>

      <!-- Switch Link -->
      <p class="auth-glass-switch">
        Don't have an account?
        <a href="/signup.html">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- Bottom Bar -->
  <footer class="auth-bottom-bar">
    <div>
      <div class="auth-bottom-slogan">Timeless Styles.<br>For Everyone.</div>
      <div class="auth-bottom-bar-line"></div>
    </div>

    <div class="auth-bottom-est">
      <div>Zarona Unisex</div>
      <div>Est. 2025</div>
    </div>
  </footer>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('login-password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.style.color = isPassword ? '#FFFFFF' : 'rgba(255, 255, 255, 0.5)';
      });
    }

    // Direct Login Handling without Alerts
    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('login-submit-btn');

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying...</span>';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Invalid email or password.');
          }

          // Persist user session
          localStorage.setItem('zarona_session', JSON.stringify({
            token: data.token,
            refresh_token: data.refresh_token,
            user: data.user
          }));

          // Direct redirect based on role:
          if (data.user && data.user.role === 'admin') {
            localStorage.setItem('zarona_admin_session', JSON.stringify({
              token: data.token,
              refresh_token: data.refresh_token,
              user: data.user
            }));
            window.location.href = '/admin/index.html';
          } else {
            window.location.href = '/index.html';
          }

        } catch (err) {
          errorMsg.textContent = err.message || 'An error occurred during sign in.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Login</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          `;
        }
      });
    }
  </script>
</body>
</html>
